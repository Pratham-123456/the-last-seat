name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: last_seat_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: last_seat_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U last_seat_app -d last_seat_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://last_seat_app:ci_only_password@localhost:5432/last_seat_test_db
      TEST_DATABASE_URL: postgresql+psycopg://last_seat_app:ci_only_password@localhost:5432/last_seat_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
